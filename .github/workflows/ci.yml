name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "./backend[dev]"

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v

      - name: Verify change ledger
        run: python tools/check_change_ledger.py

      - name: Check document links
        run: python tools/check_document_links.py

      - name: Verify golden research results
        run: python tools/verify_golden_research.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci --prefix frontend

      - name: Test frontend research configuration
        run: npm test --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

# Use only with an explicit factorlab-historical-qa-* project and a fresh temp runtime.
# Run tools/verify_historical_qa_compose.py before starting services.
services:
  web:
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:18022/api/v1
    ports: !override ["127.0.0.1:15122:5173"]
  api:
    environment:
      CORS_ORIGINS: http://127.0.0.1:15122,http://localhost:15122
    ports: !override ["127.0.0.1:18022:8000"]
    volumes: !override
      - ./data/sample:/data/sample:ro
      - ${FACTORLAB_HISTORICAL_QA_RUNTIME_DIR:?set a fresh isolated runtime directory}:/data/runtime
      - ./data/real/bundles:/data/real/bundles:ro
  worker:
    volumes: !override
      - ./data/sample:/data/sample:ro
      - ${FACTORLAB_HISTORICAL_QA_RUNTIME_DIR:?set a fresh isolated runtime directory}:/data/runtime
      - ./data/real/bundles:/data/real/bundles:ro
